name = "tidemarks"
main = "src/worker.js"
compatibility_date = "2026-09-09"

# 适配 Cloudflare 控制台的「npx wrangler deploy」
# 不要写 pages_build_output_dir，否则会被当成 Pages 项目

[assets]
directory = "."
binding = "ASSETS"
run_worker_first = ["/api/*"]

# 可选：在 Dashboard 绑定同名 KV，不要把 id 写进仓库
# [[kv_namespaces]]
# binding = "BOOKMARKS"
# id = "替换为 KV namespace id"
