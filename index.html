<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>潮迹 TideMarks</title>
  <meta name="description" content="部署在 Cloudflare 上的海风书签起始页">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=DM+Sans:wght@400;600&family=Noto+Sans+SC:wght@400;600&family=Noto+Serif+SC:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>
  <div class="wave"></div>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <img class="logo" src="./favicon.svg" alt="">
        <div>
          <h1 id="title">潮迹 TideMarks</h1>
          <p id="subtitle">海风起处，书签成岸</p>
        </div>
      </div>
      <div class="clock-wrap">
        <div class="clock" id="clock">--:--</div>
        <div class="date" id="date"></div>
      </div>
    </header>
    <div class="search-row">
      <div class="search">
        <span class="icon">⌕</span>
        <input id="q" type="search" placeholder="搜索书签，或按 Enter 用 Google 检索 · 快捷键 /" autocomplete="off">
      </div>
      <div class="actions">
        <button class="btn" id="themeBtn" type="button">主题</button>
        <button class="btn" id="editBtn" type="button">编辑</button>
        <button class="btn" id="addCatBtn" type="button">+ 分类</button>
        <button class="btn" id="exportBtn" type="button">导出</button>
        <button class="btn" id="importBtn" type="button">导入</button>
        <button class="btn" id="resetBtn" type="button">重置</button>
        <button class="btn gold" id="cloudPull" type="button">云拉取</button>
        <button class="btn gold" id="cloudPush" type="button">云推送</button>
        <input id="importFile" type="file" accept="application/json" hidden>
      </div>
    </div>
    <div class="status-row" id="cloudStatus">正在检测云端接口…</div>
    <div class="cats" id="cats"></div>
    <footer>
      <span>TideMarks · Cloudflare Workers · </span>
      <a href="https://000666.best" target="_blank" rel="noopener">000666.best</a>
      <a class="gh" href="https://github.com/Cunhe/tidemarks" target="_blank" rel="noopener" aria-label="GitHub 仓库">
        <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
          <path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82A7.68 7.68 0 0 1 8 4.77c.68.003 1.36.092 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/>
        </svg>
        GitHub
      </a>
    </footer>
  </main>
  <div class="modal-bg" id="modalBg">
    <div class="modal">
      <h3 id="modalTitle">书签</h3>
      <div class="field">
        <label for="fName">名称</label>
        <input id="fName" type="text" placeholder="Suno">
      </div>
      <div class="field">
        <label for="fUrl">网址</label>
        <input id="fUrl" type="url" placeholder="https://">
      </div>
      <div class="field">
        <label for="fDesc">备注</label>
        <textarea id="fDesc" placeholder="一句话说明"></textarea>
      </div>
      <div class="modal-actions">
        <button class="btn" id="modalCancel" type="button">取消</button>
        <button class="btn gold" id="modalSave" type="button">保存</button>
      </div>
    </div>
  </div>
  <div class="modal-bg" id="tokenBg">
    <div class="modal">
      <h3>云推送到 KV</h3>
      <p class="hint">填写 Worker 环境变量 <code>ADMIN_TOKEN</code> 的同一串值。只存在当前浏览器会话里。</p>
      <div class="field">
        <label for="fToken">ADMIN_TOKEN</label>
        <input id="fToken" type="password" placeholder="和 Cloudflare Variables 里一致" autocomplete="off">
      </div>
      <div class="modal-actions">
        <button class="btn" id="tokenCancel" type="button">取消</button>
        <button class="btn gold" id="tokenSave" type="button">确认推送</button>
      </div>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <script src="./assets/js/app.js"></script>
</body>
</html>
